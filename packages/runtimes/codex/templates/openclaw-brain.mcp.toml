# Codex MCP-server fragment for the openclaw-brain proxy.
# Append (or merge) into ~/.codex/config.toml. The digital-me CLI's
# `install --runtime codex` command does this idempotently (with absolute
# node + proxy paths resolved at install time).
#
# Pre-requisite: install @digital-me/brain-mcp-proxy and ensure
# `digital-me-brain-proxy` is on PATH (the CLI's `digital-me doctor`
# checks this).
#
# Backend selection lives in the `env` table because Codex does NOT forward
# the parent shell's environment to MCP servers. Precedence inside the proxy
# (brain-mcp-proxy/config.ts):
#   1. DIGITAL_ME_BRAIN_URL — the digital-me brain-host (recommended). Its
#      bearer token is read from DIGITAL_ME_BRAIN_TOKEN_FILE (default
#      <DIGITAL_ME_WIKI_ROOT or ~/digital-me>/.data/brain-host.token, the
#      mode-600 file `digital-me install --runtime brain-host` writes), or
#      from DIGITAL_ME_BRAIN_TOKEN when you really must inline it. A URL with
#      no resolvable token is a configuration error, never a silent fallback.
#   2. OPENCLAW_GATEWAY_HOST / OPENCLAW_GATEWAY_PORT / OPENCLAW_GATEWAY_TOKEN.
#   3. $OPENCLAW_HOME/openclaw.json (gateway.auth.token).
# Omit both DIGITAL_ME_BRAIN_* keys to stay on the openclaw gateway.
# Prefer the FILE path: config.toml then never carries the secret itself.
#
# Codex hooks (~/.codex/hooks.json) see neither this env table nor
# `[shell_environment_policy.set]` (that one only reaches commands Codex runs
# through its shell tool). `digital-me install --runtime codex` therefore
# writes the same two variables to ~/.codex/hooks/digital-me-brain.env, which
# the hooks read when DIGITAL_ME_BRAIN_URL is not in their environment, and
# also merges them into `[shell_environment_policy.set]` for shell commands.

[mcp_servers.openclaw-brain]
command = "digital-me-brain-proxy"
args = []
env = { OPENCLAW_AGENT_ID = "codex", DIGITAL_ME_BRAIN_URL = "http://127.0.0.1:18791/tools/invoke", DIGITAL_ME_BRAIN_TOKEN_FILE = "/home/<you>/digital-me/.data/brain-host.token" }
