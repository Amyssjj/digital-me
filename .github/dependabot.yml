# Cooling-off periods (`cooldown:` below) delay Dependabot from opening a PR for
# a freshly published version. This is the load-bearing supply-chain guard, and
# it has to live here rather than only in pnpm-workspace.yaml's
# `minimumReleaseAge`, because that setting cannot see this path at all:
#
#   - CI installs with `--frozen-lockfile`, which does no resolution, so the
#     maturity constraint is never evaluated (verified: a frozen install passed
#     with a 6-day-old package in the lockfile under a 7-day floor);
#   - Dependabot resolves and writes the lockfile itself, and does not read
#     pnpm's settings.
#
# So without `cooldown`, a malicious release published an hour ago could be
# proposed, pass CI, and auto-merge. `minimumReleaseAge` still earns its place
# for local and manual resolution; the two are complementary, not redundant.
#
# Security updates are not delayed by cooldown — only version updates are.
version: 2
updates:
  # JS/TS workspace — root manifest plus every package in the pnpm monorepo.
  - package-ecosystem: npm
    # ONLY "/". Not "/packages/**", which looks like it adds per-package
    # coverage and in fact adds nothing but breakage.
    #
    # pnpm keeps ONE lockfile, at the root. The "/" job understands that: it
    # edits whichever workspace member's package.json needs the bump AND
    # regenerates the root pnpm-lock.yaml alongside it (e.g. #80 touched
    # packages/services/dashboard/package.json + pnpm-lock.yaml).
    #
    # A "/packages/**" job is scoped to its own directory, so it rewrites the
    # nested package.json and never touches the root lockfile. Every PR it
    # opens is therefore born failing `pnpm install --frozen-lockfile` with
    # ERR_PNPM_OUTDATED_LOCKFILE, and no rebase can fix it — the job will
    # regenerate the same broken diff forever.
    #
    # The record, before this change: per-directory jobs produced 12 PRs and
    # merged 0 (9 closed unmerged, 3 open and unmergeable). Root-directory
    # jobs merged normally. The dead PRs also consumed the 10-slot
    # open-pull-requests-limit, which starved the queue — including security
    # updates and the grouped react PR that could never open.
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      # Patch and minor are the ones that auto-merge without a human reading the
      # diff, so they carry the full window. Majors always stop for review, and
      # delaying them only delays the migration work becoming visible.
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 3
    groups:
      # Must be declared first: a dependency joins the FIRST group whose rules it
      # matches, so the broad dev/production groups below would otherwise absorb
      # react's minor and patch bumps and split the family apart.
      #
      # react and react-dom are version-locked to each other, and their @types
      # follow. As separate PRs (the old #37 / #41) they could never both be up
      # to date at once under the up-to-date-branch rule: landing either one
      # instantly made the other stale, and the pair deadlocked for weeks. One PR
      # moves them together or not at all.
      #
      # `major` is included here, unlike in every other group. That is safe
      # because grouping does not bypass review: fetch-metadata reports a mixed
      # group at its highest update-type, so any group containing a major is
      # reported as a major and dependabot-auto-merge declines it. A react-only
      # patch still arrives as a patch and still lands unattended.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
          - minor
          - patch
      # Same version-lock argument as react, and the same deadlock in practice:
      # @vitest/coverage-v8 peer-depends on an exactly matching vitest, so the
      # two arrived as #73 / #74 and could never both be current at once.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      # One group for everything that auto-merges, rather than the previous
      # dev / production split.
      #
      # The split cost a PR without buying a decision: both halves were
      # minor+patch, both auto-merged on green, so nothing was ever reviewed
      # differently because of which one it landed in. What it did buy was a
      # second CI cycle every week — and in a pnpm monorepo the second PR does
      # not merely go stale, it goes DIRTY, because the first one rewrote
      # pnpm-lock.yaml. Halving the count halves that conflict cascade.
      #
      # Declared last: react and vitest above claim their members first, so this
      # catch-all never splits either family apart.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Python services. All three are listed explicitly rather than by glob: the
  # dashboard intake package sits deeper than the others, and a glob that missed
  # it would fail silently — which is exactly how digest and intake went
  # unmonitored while both were building and testing in CI.
  - package-ecosystem: pip
    directories:
      - "/packages/services/dream-cycle"
      - "/packages/services/digest"
      - "/packages/services/dashboard/src/intake"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped including majors, matching the github-actions treatment rather
    # than the npm one. The whole Python surface is pyyaml plus pytest, so
    # per-package PRs would be three-way noise for a two-package tree, and a
    # major here is a test-runner bump rather than a migration.
    groups:
      python:
        patterns:
          - "*"
    cooldown:
      # pip is not a SemVer ecosystem to Dependabot, so only default-days applies.
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One grouped PR for all action bumps instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

# Note on major version updates: they are intentionally left ungrouped so each
# arrives as its own PR for deliberate review — majors often need migration work
# (e.g. vitest 4, typescript 6). The exception is a version-locked family
# (react, vitest): those must move together or not at all, so grouping them is
# what makes review possible rather than what skips it.
#
# The dependabot-auto-merge workflow only auto-merges patch/minor, so a major
# never lands unattended. Majors are NOT
# ignored here on purpose: that would also suppress security fixes that are only
# available in a new major (e.g. the vitest 2 → 3 CVE patch, GHSA-5xrq-8626-4rwp).
