name: Publish CLI to npm

# Tag-driven release for `@digital-me/cli`. Tag convention: cli-vX.Y.Z
# (must match packages/cli/package.json version).
#
# The published artifact is a single esbuild bundle (workspace:* deps inlined,
# only esbuild external) produced by scripts/build-cli-bundle.mjs, so
# `npm i -g digital-me` works with no monorepo. See docs/RELEASING.md.
#
# Auth: set the DM_NPM_TOKEN repo secret (an npm automation token, or granular
# token with Bypass-2FA, with publish rights to the unscoped `digital-me`
# package). Provenance is enabled (needs id-token).

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build bundle + publish to npm
    runs-on: ubuntu-latest
    # Gate the npm credential behind an environment. Unlike the dream-cycle
    # publish, which uses PyPI trusted publishing and holds no long-lived
    # secret, this job carries `DM_NPM_TOKEN` — a standing token that can push a
    # release under our name. `workflow_dispatch` means anyone with write access
    # can start a publish, so the environment's required reviewer is what makes
    # a release a deliberate act rather than a side effect of a pushed tag.
    #
    # NOTE: the `npm` environment must exist with a required reviewer before this
    # merges. GitHub auto-creates a referenced environment with NO protection
    # rules, which would silently make this line decorative.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # Build workspace dists first so the bundler inlines built output.
      - run: pnpm build
      - run: pnpm build:cli-bundle
      - name: Verify bundle version matches the tag (push-tag runs only)
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          ver=$(node -p "require('./packages/cli/npm-dist/package.json').version")
          echo "tag=$tag bundle=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag ($tag) != cli version ($ver)"; exit 1; }
      - name: Publish
        run: npm publish --provenance
        working-directory: packages/cli/npm-dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DM_NPM_TOKEN }}
