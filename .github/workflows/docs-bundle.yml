# Docs bundle → motusai.co (producer-push)
#
# The docs the website serves are generated HERE (scripts/gen-docs.mjs) and
# committed THERE (Amyssjj/motus-ai-web content/docs/), so the git diff in the
# consumer is the review surface and its builds stay hermetic. The event has to
# flow producer → consumer: whenever a docs source lands on main (or a CLI
# release tag is cut), regenerate the bundle and open — or update in place —
# a PR in motus-ai-web. The website's normal loop takes over from there:
# Vercel preview on the PR → verify → merge → deploy.
#
# Trigger design:
#   - push to main, filtered to the files gen-docs.mjs actually reads (the
#     authored docs/site pages and the three code files the reference pages are
#     extracted from) plus this workflow. One stable branch, `docs-sync/main`,
#     force-pushed and its PR edited in place — never one PR per commit.
#   - release tags `cli-v*` (the tag the CLI actually ships under) → a
#     `docs-sync/<tag>` branch + PR, so a release always carries its docs.
#   - manual dispatch for a re-run.
#
# REQUIRES the `MOTUS_AI_WEB_TOKEN` repo secret — a fine-grained PAT (or GitHub
# App installation token) scoped to Amyssjj/motus-ai-web with
# contents:write + pull-requests:write. A missing secret FAILS the run with a
# clear annotation: an inert guard that exits 0 would show green while the site
# silently went stale (that is exactly what happened between 2026-06 and
# 2026-09). The extractor itself is gated (whitelist sources, leak scan with
# hard exit), so nothing un-reviewed can flow out of this repo.

name: docs-bundle

on:
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - "scripts/gen-docs.mjs"
      - "packages/cli/src/bin/digital-me.ts"
      - "packages/plugins/brain-orchestrator/src/plugin/entry.ts"
      - "packages/shared/contracts/src/env.ts"
      - ".github/workflows/docs-bundle.yml"
    tags:
      - "cli-v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docs-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Require MOTUS_AI_WEB_TOKEN
        env:
          TOKEN: ${{ secrets.MOTUS_AI_WEB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=docs-bundle not configured::MOTUS_AI_WEB_TOKEN is not set on Amyssjj/digital-me. The docs bundle was NOT synced to motus-ai-web. Create a fine-grained PAT scoped to Amyssjj/motus-ai-web (contents:write, pull-requests:write) and add it as that secret; re-run this workflow afterwards."
            exit 1
          fi

      - name: Checkout digital-me
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gen-docs stamps `git describe --tags` into _meta.json; a shallow
          # clone would stamp a bare SHA on tag runs.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate docs bundle (leak-scanned)
        run: node scripts/gen-docs.mjs --out /tmp/docs-bundle

      - name: Checkout motus-ai-web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Amyssjj/motus-ai-web
          token: ${{ secrets.MOTUS_AI_WEB_TOKEN }}
          path: motus-ai-web

      - name: Replace content/docs
        run: |
          rm -rf motus-ai-web/content/docs
          mkdir -p motus-ai-web/content
          cp -R /tmp/docs-bundle motus-ai-web/content/docs

      - name: Open or update the PR in motus-ai-web
        env:
          GH_TOKEN: ${{ secrets.MOTUS_AI_WEB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          cd motus-ai-web
          SHORT="${SHA:0:7}"
          # Provenance stamps differ on every run — _meta.json (generatedAt,
          # commit, ref) and the "Docs build:" line in llms.txt — and are not
          # worth a PR on their own. Stage everything (so added/removed pages
          # count too) and ask git whether anything but those lines changed.
          git add -A content/docs
          if git diff --cached --quiet -I '^- Docs build: ' -- content/docs ':!content/docs/_meta.json'; then
            echo "content/docs already matches digital-me $REF_NAME ($SHORT) — only provenance stamps differ; nothing to PR."
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            BRANCH="docs-sync/$REF_NAME"
            TITLE="docs: sync from digital-me $REF_NAME"
          else
            BRANCH="docs-sync/main"
            TITLE="docs: sync from digital-me main @ $SHORT"
          fi
          BODY="Auto-generated docs bundle from digital-me \`$REF_NAME\` (\`$SHORT\`) — [workflow run]($RUN_URL).

          The diff is the review surface: verify the Vercel preview, then merge to deploy. This branch is force-pushed by the producer workflow (authored as the actor who triggered the run, so Vercel deploys the preview); do not commit to it by hand."
          # Author the commit as the GitHub account that triggered this run
          # (its users.noreply address). Vercel blocks a preview deployment
          # whose commit author is not a member of the project's team — a
          # synthetic "docs bot" identity produced "Deployment was blocked" on
          # the very first sync PR — and it maps this address back to the
          # actor's login, who is the maintainer merging to main.
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force
          EXISTING=$(gh pr list --repo Amyssjj/motus-ai-web --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo Amyssjj/motus-ai-web --title "$TITLE" --body "$BODY"
            echo "Updated PR #$EXISTING on branch $BRANCH."
          else
            gh pr create --repo Amyssjj/motus-ai-web --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
