name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for GitHub's merge queue: the queue builds a candidate branch and
  # waits for the required checks to report against it. Without this trigger the
  # checks never run there and every queued PR hangs until it times out.
  merge_group:

# Every job here only reads the repo. Declared explicitly rather than inherited:
# the repo-wide default is a setting a future maintainer can widen without ever
# touching this file, and CI is the workflow an untrusted pull request gets the
# most influence over.
permissions:
  contents: read

jobs:
  sanitize:
    name: Sanitize gate (forbidden-pattern scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run sanitize-check
        run: bash scripts/sanitize-check.sh

  build:
    name: Build, typecheck, lint, knip, test
    runs-on: ubuntu-latest
    needs: sanitize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first so workspace deps emit dist/ — typecheck and test
      # both resolve `@digital-me/<pkg>` via the built output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Dead-code guard. Fails only on high-signal categories (unused files,
      # deps, unlisted/unresolved imports); unused exports/types report as
      # warnings (see knip.json rules + the documented ignore-list).
      - run: pnpm knip
      - run: pnpm test

  dream-cycle-python:
    name: dream-cycle (pytest + sdist + wheel)
    runs-on: ubuntu-latest
    needs: sanitize
    defaults:
      run:
        working-directory: packages/services/dream-cycle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: Build sdist + wheel
        run: python -m build
      - name: Install built wheel and smoke-test console script
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/digital_me_dream_cycle-*-py3-none-any.whl
          /tmp/wheel-venv/bin/digital-me-dream-cycle --help > /dev/null
          /tmp/wheel-venv/bin/python -c "import dream_cycle.run"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dream-cycle-dist
          path: packages/services/dream-cycle/dist/*
          if-no-files-found: error
          retention-days: 7

  digest-python:
    name: digest (pytest + sdist + wheel)
    runs-on: ubuntu-latest
    needs: sanitize
    defaults:
      run:
        working-directory: packages/services/digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: Build sdist + wheel
        run: python -m build
      - name: Install built wheel, smoke-test console script + the digest smoke gate
        run: |
          python -m venv /tmp/digest-wheel-venv
          /tmp/digest-wheel-venv/bin/pip install dist/digital_me_digest-*-py3-none-any.whl
          /tmp/digest-wheel-venv/bin/digital-me-digest --help > /dev/null
          /tmp/digest-wheel-venv/bin/python -c "import digest.daily_digest"
          # The smoke gate must pass from a clean wheel install — this also
          # proves presentation.schema.json actually ships in the wheel.
          /tmp/digest-wheel-venv/bin/python -m digest.smoke
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-dist
          path: packages/services/digest/dist/*
          if-no-files-found: error
          retention-days: 7
