name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Deny by default: the job below grants itself exactly the scopes it needs. A job
# added later inherits nothing and fails loudly, rather than silently picking up
# the write scopes this workflow's existing job happens to require.
permissions: {}

jobs:
  claude:
    # Two gates, both required.
    #
    # 1. The `@claude` mention.
    # 2. The author must be trusted. This repository is public, so *anyone* can
    #    open an issue and comment — and these events run from the default branch
    #    with access to secrets, so an ungated trigger would hand a stranger a
    #    job holding `contents: write` and the Claude OAuth token.
    #
    # claude-code-action performs its own write-permission check, so this is
    # defence in depth rather than the only thing standing in the way. It is
    # here because the effective gate should be readable in this file: a control
    # that lives only inside a third-party action is invisible at review time,
    # and silently inherits whatever that action's default becomes.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      ) && contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets the github_ci MCP server start so Claude can read CI status on
      # the PR it is answering about. Without it the run logs "The github_ci
      # MCP server requires 'actions: read' permission. Skipping CI server
      # installation" and Claude answers blind to whether tests passed.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1.0.199
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If you'd rather use a pay-per-token API key instead of your
          # Claude Code Pro/Max subscription, swap the line above for:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
